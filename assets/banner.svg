<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0c1b33" />
      <stop offset="100%" stop-color="#061325" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
    .float-grid {
      stroke: #1e3a5f;
      stroke-width: 0.5;
      stroke-opacity: 0.3;
    }
  </style>

  <!-- Deep Lakehouse Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Decorative Grid Lines -->
  <line x1="0" y1="70" x2="1200" y2="70" class="float-grid" />
  <line x1="0" y1="140" x2="1200" y2="140" class="float-grid" />
  <line x1="0" y1="210" x2="1200" y2="210" class="float-grid" />
  <line x1="0" y1="280" x2="1200" y2="280" class="float-grid" />
  <line x1="200" y1="0" x2="200" y2="360" class="float-grid" />
  <line x1="400" y1="0" x2="400" y2="360" class="float-grid" />
  <line x1="600" y1="0" x2="600" y2="360" class="float-grid" />
  <line x1="800" y1="0" x2="800" y2="360" class="float-grid" />
  <line x1="1000" y1="0" x2="1000" y2="360" class="float-grid" />

  <!-- Dynamic Wave Animations -->
  <path d="M-50,290 C 250,230 450,330 750,270 C 950,230 1100,310 1250,280" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="10s" repeatCount="indefinite" />
  </path>
  <path d="M-50,315 C 200,260 500,350 800,285 C 1000,250 1150,330 1250,305" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="12s" repeatCount="indefinite" />
  </path>

  <!-- Ambient Light Orbs with Pulsing Glow -->
  <circle cx="180" cy="60" r="90" fill="#38bdf8" opacity="0.07" filter="url(#glow)">
    <animate attributeName="r" values="80;105;80" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.05;0.12;0.05" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="1020" cy="80" r="100" fill="#818cf8" opacity="0.07" filter="url(#glow)">
    <animate attributeName="r" values="90;115;90" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.05;0.11;0.05" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="320" r="120" fill="#34d399" opacity="0.06" filter="url(#glow)">
    <animate attributeName="opacity" values="0.04;0.09;0.04" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- Floating Iceberg Polygon Geometry in lower right -->
  <g transform="translate(1030, 220)" opacity="0.7">
    <polygon points="0,-35 30,10 18,35 -20,35 -30,0" fill="#0284c7" opacity="0.25" stroke="#38bdf8" stroke-width="1.5">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="5s" repeatCount="indefinite" />
    </polygon>
    <polygon points="0,-35 15,10 -5,15" fill="#38bdf8" opacity="0.4" />
  </g>

  <!-- FOREGROUND LAYER: Title & Subtitle Always in Crisp Foreground -->

  <!-- Top Category Tag Pill -->
  <g transform="translate(440, 48)">
    <rect width="320" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <circle cx="20" cy="15" r="4" fill="#34d399">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" fill="#38bdf8" class="badge-text">OPEN TABLE FORMAT &amp; LAKEHOUSE</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="132" text-anchor="middle" fill="url(#textGrad)" class="title" filter="url(#subtleGlow)">
    Apache Iceberg &amp; Open Lakehouse
  </text>

  <!-- Subtitle -->
  <text x="600" y="172" text-anchor="middle" fill="url(#subGrad)" class="subtitle">
    Curated SaaS Solutions &bull; REST Catalogs &bull; Open-Source Lakehouse Compute Engines
  </text>

  <!-- Architecture Flow Pills (Foreground Bottom Layer) -->
  <g transform="translate(130, 225)">
    <!-- Storage & Format Pill -->
    <g transform="translate(0, 0)">
      <rect width="200" height="44" rx="10" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="100" y="27" text-anchor="middle" fill="#e2e8f0" class="badge-text">Iceberg &bull; Lance &bull; Delta</text>
    </g>

    <!-- Arrow 1 -->
    <text x="225" y="28" fill="#38bdf8" font-size="18" font-family="monospace">&rarr;</text>

    <!-- REST Catalog Pill -->
    <g transform="translate(250, 0)">
      <rect width="205" height="44" rx="10" fill="url(#cardBg)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="102" y="27" text-anchor="middle" fill="#e2e8f0" class="badge-text">Polaris &bull; Glue &bull; Nessie</text>
    </g>

    <!-- Arrow 2 -->
    <text x="480" y="28" fill="#818cf8" font-size="18" font-family="monospace">&rarr;</text>

    <!-- Multi-Engine Query Pill -->
    <g transform="translate(505, 0)">
      <rect width="205" height="44" rx="10" fill="url(#cardBg)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="102" y="27" text-anchor="middle" fill="#e2e8f0" class="badge-text">Spark &bull; Trino &bull; Flink</text>
    </g>

    <!-- Arrow 3 -->
    <text x="735" y="28" fill="#34d399" font-size="18" font-family="monospace">&rarr;</text>

    <!-- Enterprise & BI Pill -->
    <g transform="translate(760, 0)">
      <rect width="180" height="44" rx="10" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="90" y="27" text-anchor="middle" fill="#e2e8f0" class="badge-text">Snowflake &bull; BigQuery</text>
    </g>
  </g>
</svg>